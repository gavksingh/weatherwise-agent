services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    env_file:
      - .env
    environment:
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
    networks:
      - internal
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/sse')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  agent-backend:
    build:
      context: .
      dockerfile: Dockerfile.agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./project-cf964f7d-d79b-4b69-81c-f362e2771c2b.json:/secrets/service-account.json:ro
    environment:
      - MCP_SERVER_URL=http://mcp-server:8001/sse
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/service-account.json
    depends_on:
      mcp-server:
        condition: service_healthy
    networks:
      - internal
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        API_URL: http://agent-backend:8000
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://agent-backend:8000
    depends_on:
      agent-backend:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

networks:
  internal:
    internal: true
