services:
  mcp-server:
    build: ./mcp-server
    ports:
      - "8001:8001"
    env_file:
      - .env
    restart: unless-stopped

  agent-backend:
    build: ./agent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mcp-server
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - agent-backend
    restart: unless-stopped
